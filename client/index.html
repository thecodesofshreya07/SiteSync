<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteSync - Enterprise Construction Ops</title>
    <script type="text/javascript">
      // Early sync of Google Translate cookie from localStorage
      (function() {
        try {
          var saved = localStorage.getItem('sitesync_language');
          if (saved === 'hi') {
            document.cookie = 'googtrans=/en/hi; path=/;';
            document.cookie = 'googtrans=/en/hi; path=/; domain=' + window.location.hostname + ';';
            document.cookie = 'googtrans=/en/hi; path=/; domain=.' + window.location.hostname + ';';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="position:fixed; bottom:0; right:0; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; z-index:-1000;"></div>
    <div id="root"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function () {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,hi',
            autoDisplay: false,
          },
          'google_translate_element'
        );
      };
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
